# PR 이 열리거나 새 커밋이 올라오면 Claude 가 코드를 읽고 PR 에 리뷰 코멘트를 단다.
# 출처: https://code.claude.com/docs/en/github-actions 「Run a skill」 예시. 인증 줄만 구독 토큰으로 바꿨다.
# 필요한 것: ① Claude GitHub 앱(https://github.com/apps/claude) 이 이 저장소에 설치돼 있을 것
#           ② 저장소 secret CLAUDE_CODE_OAUTH_TOKEN (터미널에서 `claude setup-token` 으로 만든 값)
# 이미 Claude 코멘트가 달린 PR, draft PR, 닫힌 PR 은 다시 리뷰하지 않는다.
name: Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
